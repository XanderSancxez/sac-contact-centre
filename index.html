function detectLang() {
  try { const s = localStorage.getItem("nfc_lang"); if (SUPPORTED[s]) return s; } catch (_) {}
  for (const l of (navigator.languages || [navigator.language || "es"])) {
    const p = String(l).slice(0, 2).toLowerCase();
    if (SUPPORTED[p]) return p;
  }
  return "es";
}

// ---- Traducción automática dinámica con Caché ----
async function translateText(text, targetLang, sourceLang = "es") {
  if (!text || targetLang === sourceLang) return text;

  const cacheKey = `tr_${sourceLang}_${targetLang}_${text}`;
  const cached = localStorage.getItem(cacheKey);
  if (cached) return cached;

  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.responseData && data.responseData.translatedText) {
      const translated = data.responseData.translatedText;
      localStorage.setItem(cacheKey, translated);
      return translated;
    }
  } catch (e) {
    console.warn("Fallo de traducción en API:", e);
  }
  return text;
}

// ---- vCard 3.0 ----
const esc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");

function buildVCard() {
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${esc(CONFIG.lastName)};${esc(CONFIG.firstName)};;;`,
    `FN:${esc(fullName)}`,
    `ORG:${esc(CONFIG.org)}`,
    `TITLE:${esc(CONFIG.title)}`,
    CONFIG.phone && `TEL;TYPE=CELL:${CONFIG.phone}`,
    CONFIG.email && `EMAIL;TYPE=INTERNET:${CONFIG.email}`,
    CONFIG.linkedin && `URL:${CONFIG.linkedin}`,
    CONFIG.github && `URL:${CONFIG.github}`,
    "END:VCARD"
  ].filter(Boolean);
  return lines.join("\r\n");
}

$("saveContact").addEventListener("click", () => {
  const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${fullName.replace(/\s+/g, "_")}.vcf`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});

  .split(";").map(r => { const [iso, name, dial] = r.split("|"); return { iso, name, dial: "+" + dial }; });

const flagEmoji = (iso) => iso.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const ccBtn = $("ccBtn"), ccPanel = $("ccPanel"), ccSearch = $("ccSearch"), ccList = $("ccList");
let selectedCountry = COUNTRIES.find(c => c.iso === "CO");

try {
  const region = ((navigator.language || "").split("-")[1] || "").toUpperCase();
  const match = region && COUNTRIES.find(c => c.iso === region);
  if (match) selectedCountry = match;
} catch (_) {}

function setCountry(c) {
  selectedCountry = c;
  $("ccFlag").textContent = flagEmoji(c.iso);
  $("ccDial").textContent = c.dial;
}

const regionNames = {};
function cname(c) {
  try {
    if (!regionNames[lang]) regionNames[lang] = new Intl.DisplayNames([lang], { type: "region" });
    return regionNames[lang].of(c.iso) || c.name;
  } catch (_) { return c.name; }
}

function filterCountries(q) {
  const n = norm(q.trim()).replace(/^\+/, "");
  if (!n) return COUNTRIES;
  return COUNTRIES.filter(c =>
    norm(c.name).includes(n) || norm(cname(c)).includes(n) ||
    c.dial.slice(1).startsWith(n) || c.iso.toLowerCase() === n
  );
}

function renderList(q = "") {
  ccList.innerHTML = "";
  const items = filterCountries(q).slice().sort((a, b) => cname(a).localeCompare(cname(b), lang));
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "px-3 py-3 text-sm text-slate-500";
    li.textContent = T("noResults");
    ccList.appendChild(li);
    return;
  }
  items.forEach(c => {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.className = "flex items-center gap-3 px-3 py-3 text-sm cursor-pointer hover:bg-slate-800 active:bg-slate-700";
    const f = document.createElement("span"); f.textContent = flagEmoji(c.iso);
    const n = document.createElement("span"); n.className = "flex-1 truncate"; n.textContent = cname(c);
    const d = document.createElement("span"); d.className = "text-slate-400"; d.textContent = c.dial;
    li.append(f, n, d);
    li.addEventListener("click", () => { setCountry(c); closePanel(); $("telefono").focus(); });
    ccList.appendChild(li);
  });
}

function openPanel() {
  ccSearch.value = "";
  renderList();
  ccPanel.classList.remove("hidden");
  ccBtn.setAttribute("aria-expanded", "true");
  ccSearch.focus();
}

function closePanel() {
  ccPanel.classList.add("hidden");
  ccBtn.setAttribute("aria-expanded", "false");
}

ccBtn.addEventListener("click", () => ccPanel.classList.contains("hidden") ? openPanel() : closePanel());
ccSearch.addEventListener("input", () => renderList(ccSearch.value));
ccSearch.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const first = filterCountries(ccSearch.value)[0];
    if (first) { setCountry(first); closePanel(); $("telefono").focus(); }
  } else if (e.key === "Escape") closePanel();
});
document.addEventListener("click", (e) => {
  if (!ccPanel.contains(e.target) && !ccBtn.contains(e.target)) closePanel();
});
setCountry(selectedCountry);

// ---- Gestión del Formulario ----
const form = $("form");
const STORAGE_KEY = "nfc_contact_sent";

function showSuccess() {
  form.classList.add("hidden");
  $("success").classList.remove("hidden");
}

try { if (localStorage.getItem(STORAGE_KEY)) showSuccess(); } catch (_) {}

function showError(msg) {
  const el = $("error");
  el.textContent = msg;
  el.classList.remove("hidden");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").classList.add("hidden");

  const data = Object.fromEntries(new FormData(form).entries());
  data.nombre = (data.nombre || "").trim();
  data.email = (data.email || "").trim();
  data.organizacion = (data.organizacion || "").trim();

  const num = (data.telefono || "").trim();
  data.telefono = !num ? "" : (num.startsWith("+") ? num : `${selectedCountry.dial} ${num.replace(/^0+/, "")}`);

  if (!data.nombre || !data.email || !data.organizacion) {
    return showError(T("errReq"));
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
    return showError(T("errMail"));
  }
  if (data.website) return showSuccess(); // honeypot
  delete data.website;

  if (!CONFIG.webhookUrl || CONFIG.webhookUrl.startsWith("PEGA_AQUI")) {
    return showError(T("errHook"));
  }

  const btn = $("submitBtn");
  btn.disabled = true;
  $("spinner").classList.remove("hidden");
  $("btnText").textContent = T("sending");

  data.idioma = lang;
  data.userAgent = navigator.userAgent.slice(0, 200);

  try {
    await fetch(CONFIG.webhookUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data),
      keepalive: true
    });
    try { localStorage.setItem(STORAGE_KEY, "1"); } catch (_) {}
    showSuccess();
  } catch (err) {
    btn.disabled = false;
    $("spinner").classList.add("hidden");
    $("btnText").textContent = T("send");
    showError(T("errNet"));
  }
});

// ---- Aplicar Idioma y Traducir Perfil Dinámicamente ----
async function applyLang() {
  const q = (s) => document.querySelector(s);
  document.documentElement.lang = lang;
  document.title = `${fullName} · ${T("docTitle")}`;

  $("saveContact").lastChild.textContent = " " + T("save");

  q("main h2").textContent = T("formTitle");
  q("main h2 + p").textContent = T("formSub");
  q("main > p").textContent = T("footer");
  q("#success h3").textContent = T("thanks");
  q("#success p").textContent = T("thanksSub");

  [["nombre", "nombre"], ["email", "email"], ["telefono", "telefono"],
   ["organizacion", "org"], ["rol", "rol"], ["notas", "notas"]]
    .forEach(([id, key]) => { q(`label[for="${id}"]`).textContent = T(key); });

  $("organizacion").placeholder = T("orgPh");
  ccSearch.placeholder = T("search");

  Array.from($("rol").options).forEach((o, i) => { o.value = ROLE_VALUES[i]; o.textContent = T("roles")[i]; });

  $("btnText").textContent = $("submitBtn").disabled ? T("sending") : T("send");
  $("error").classList.add("hidden");
  closePanel();

  // Actualizar botones de selector de idioma
  document.querySelectorAll("#langBar button").forEach(b => {
    const on = b.dataset.lang === lang;
    b.className = "px-3 py-1.5 rounded-full text-xs font-medium border transition " +
      (on ? "bg-sky-500 border-sky-500 text-slate-950" : "border-slate-700 text-slate-300 hover:bg-slate-800");
    b.setAttribute("aria-pressed", on);
  });

  // Traducir cargo y organización vía API (con caché)
  const [translatedTitle, translatedOrg] = await Promise.all([
    translateText(CONFIG.title, lang, "es"),
    translateText(CONFIG.org, lang, "es")
  ]);

  $("title").textContent = translatedTitle;
  $("org").textContent = translatedOrg;
}

Object.entries(SUPPORTED).forEach(([code, label]) => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.lang = code;
  b.textContent = label;
  b.addEventListener("click", () => {
    lang = code;
    try { localStorage.setItem("nfc_lang", code); } catch (_) {}
    applyLang();
  });
  $("langBar").appendChild(b);
});

applyLang();
</script>
